<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Точки роста телесных специалистов · МИОТ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* ── Пастельная палитра: синий · фиолетовый · оранжевый ── */
  --blue:#BCD0F7;      --blue-mid:#8FAEEC;   --blue-deep:#4E6FCB;
  --purple:#C9BEF5;    --purple-mid:#A895EE; --purple-deep:#6E56C8;
  --orange:#FBCBA2;    --orange-mid:#F5A968; --orange-deep:#D97F33;

  --ink:#1B1830;
  --ink2:rgba(27,24,48,0.70);
  --ink3:rgba(27,24,48,0.44);
  --paper:#FFFFFF;
  --paper2:#F4F2FA;
  --paper3:#EFF3FD;
  --line:rgba(27,24,48,0.09);

  --r-lg:28px;   /* карточка слайда */
  --r-md:22px;   /* блоки */
  --r-nub:6px;   /* «срезанный» угол */
  --shadow:0 2px 4px rgba(20,16,45,.06), 0 24px 60px rgba(20,16,45,.14);
}

html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  color:var(--ink);
  background:#262341;
  background-image:repeating-linear-gradient(90deg,
    rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px,
    transparent 1px, transparent 9px);
}
body{display:flex;align-items:center;justify-content:center}

.left-panel{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px}
.stage{position:relative;width:min(84vh,92vw);height:min(84vh,92vw);flex-shrink:0}

/* ════ СЛАЙД ════ */
.slide{
  position:absolute;inset:0;background:var(--paper);border-radius:var(--r-lg);overflow:hidden;
  display:flex;flex-direction:column;padding:34px 42px 48px;
  opacity:0;pointer-events:none;transform:translateY(18px) scale(.985);
  transition:opacity .34s cubic-bezier(.4,0,.2,1),transform .34s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--shadow);
}
.slide.active{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}
.slide.exit-left{opacity:0;transform:translateY(-14px) scale(.985)}

.slide.surf-b{background:var(--paper2)}
.slide.surf-c{background:var(--paper3)}

/* Акцентный (CTA) слайд */
.slide.cta-slide{background:linear-gradient(148deg,#6E56C8 0%,#5C7BD4 52%,#E09354 100%)}
.slide.cta-slide::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(620px 420px at 82% 12%,rgba(255,255,255,.20),transparent 62%);
}
.slide.cta-slide > *{position:relative;z-index:1}
.slide.cta-slide h1,.slide.cta-slide h2,.slide.cta-slide h3{color:#fff}
.slide.cta-slide p{color:rgba(255,255,255,.93)}
.slide.cta-slide .small{color:rgba(255,255,255,.72)}
.slide.cta-slide strong{color:#fff}
.slide.cta-slide .brand{color:rgba(255,255,255,.72)}
.slide.cta-slide .hd-num{background:#fff;color:var(--purple-deep)}
.slide.cta-slide .hd-chip{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.28)}
.slide.cta-slide .items li{color:rgba(255,255,255,.9)}
.slide.cta-slide .items li::before{background:rgba(255,255,255,.85)}
.slide.cta-slide .mark{background:rgba(255,255,255,.22);box-shadow:none;color:#fff}
.slide.cta-slide .progress-bar{background:rgba(255,255,255,.22)}
.slide.cta-slide .progress-bar i{background:#fff}

/* ── Шапка слайда ── */
.hd{display:flex;align-items:center;gap:9px;flex-shrink:0;margin-bottom:20px}
.hd-num{
  width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-variant-numeric:tabular-nums;
}
.hd-chip{
  border:1.5px solid var(--line);border-radius:99px;padding:5px 14px;
  font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:50%;
}
.brand{
  margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:2.2px;
  text-transform:uppercase;color:var(--ink3);white-space:nowrap;
}

/* ── Прогресс внизу ── */
.progress-bar{
  position:absolute;left:42px;right:42px;bottom:22px;height:3px;
  background:rgba(27,24,48,.10);border-radius:99px;overflow:hidden;
}
.progress-bar i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--blue-deep),var(--purple-mid),var(--orange-mid));
  transition:width .4s cubic-bezier(.4,0,.2,1);
}

.scroll-content{
  flex:1;min-height:0;overflow:visible;transform-origin:top left;
  display:flex;flex-direction:column;justify-content:flex-start;
}
.scroll-content.center{justify-content:center}
.center-slide .scroll-content{justify-content:center}
.cta-slide .scroll-content{align-items:center;text-align:center;justify-content:center}

/* ════ ТИПОГРАФИКА ════ */
h1{
  font-size:clamp(26px,3.5vw,50px);font-weight:800;line-height:1.08;
  letter-spacing:-1.1px;color:var(--ink);margin-bottom:14px;
}
h2{font-size:clamp(20px,2.4vw,32px);font-weight:600;line-height:1.28;color:var(--ink2);margin-bottom:12px;letter-spacing:-.3px}
h3{font-size:clamp(17px,1.85vw,24px);font-weight:700;color:var(--ink);margin-bottom:10px;letter-spacing:-.2px}
p{font-size:clamp(15px,1.42vw,20px);line-height:1.5;color:var(--ink2);margin-bottom:11px}
p:last-child{margin-bottom:0}
.small{font-size:clamp(13px,1.15vw,16.5px);line-height:1.5;color:var(--ink3);margin-bottom:0}
strong{color:var(--ink);font-weight:700}

/* Обводка-маркер как в референсе */
.mark{
  position:relative;display:inline-block;padding:0 .18em;
  color:var(--ink);font-weight:800;
  box-shadow:inset 0 -.42em 0 rgba(188,208,247,.72);
  border-radius:3px;
}
.mark-ring{position:relative;display:inline-block;z-index:1;padding:0 .1em}
.mark-ring::before{
  content:'';position:absolute;left:-.16em;right:-.16em;top:-.1em;bottom:-.08em;
  border:2.5px solid var(--orange-mid);border-radius:50%;
  transform:rotate(-2.4deg);z-index:-1;opacity:.85;
}

.mega-sym{display:inline-block;font-size:1.55em;font-weight:900;line-height:0;vertical-align:middle;margin:0 4px}
.mega-sym.plus{color:var(--orange-deep)}
.mega-sym.minus{color:var(--purple-deep)}
.mega-sym.emoji{font-size:1.5em;font-weight:400;margin:0 5px 0 0}

.divider{width:44px;height:4px;border-radius:99px;margin:4px 0 18px;flex-shrink:0;
  background:linear-gradient(90deg,var(--blue-deep),var(--purple-mid),var(--orange-mid))}
.cta-slide .divider{background:rgba(255,255,255,.6);margin-left:auto;margin-right:auto}

/* ── Бейдж-плашка ── */
.badge{
  display:inline-block;align-self:flex-start;
  background:var(--ink);color:#fff;border-radius:99px;
  padding:6px 16px;font-size:11px;font-weight:800;letter-spacing:1.6px;
  text-transform:uppercase;margin-bottom:16px;
}
.badge-purple{background:var(--purple-deep)}
.cta-slide .badge{background:rgba(255,255,255,.2);color:#fff;align-self:center}

/* ════ СПИСКИ ════ */
.items{list-style:none;display:flex;flex-direction:column;gap:9px;margin:4px 0 12px}
.items:last-child{margin-bottom:0}
.items li{
  position:relative;padding-left:20px;
  font-size:clamp(14.5px,1.35vw,19px);line-height:1.45;color:var(--ink2);
}
.items li::before{
  content:'';position:absolute;left:0;top:.55em;
  width:7px;height:7px;border-radius:2px;background:var(--purple-mid);
}
.items li:nth-child(3n+2)::before{background:var(--blue-mid)}
.items li:nth-child(3n+3)::before{background:var(--orange-mid)}
.items.no-dot li{padding-left:0}
.items.no-dot li::before{display:none}

/* ── Чек-лист ── */
.checklist{display:flex;flex-direction:column;gap:10px}
.check-item{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--paper2);border-radius:var(--r-md) var(--r-md) var(--r-md) var(--r-nub);
  padding:13px 16px;
}
.slide.surf-b .check-item{background:#fff}
.check-ico{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:var(--blue);color:var(--blue-deep);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;margin-top:1px;
}
.check-item:nth-child(3n+2) .check-ico{background:var(--purple);color:var(--purple-deep)}
.check-item:nth-child(3n+3) .check-ico{background:var(--orange);color:var(--orange-deep)}
.check-text{font-size:clamp(14px,1.3vw,18.5px);line-height:1.42;color:var(--ink2);flex:1}

/* ── Нумерованный список ── */
.num-list{display:flex;flex-direction:column;gap:11px}
.num-item{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--blue);border-radius:var(--r-md) var(--r-md) var(--r-md) var(--r-nub);
  padding:15px 18px;
}
.num-item:nth-child(3n+2){background:var(--purple)}
.num-item:nth-child(3n+3){background:var(--orange)}
.num-circle{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.75);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;
}
.num-text{font-size:clamp(14px,1.32vw,18.5px);line-height:1.42;color:var(--ink);flex:1;padding-top:3px}
.num-text strong{color:var(--ink);font-weight:800}

/* ── Группы (ДО / ПОСЛЕ) ── */
.groups-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:4px 0}
.group-block{
  background:var(--paper2);border-radius:var(--r-md) var(--r-md) var(--r-nub) var(--r-md);
  padding:18px 20px;
}
.group-block:nth-child(1){background:var(--blue)}
.group-block:nth-child(2){background:var(--orange)}
.group-lead{
  font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  color:var(--ink);opacity:.62;margin-bottom:10px;
}
.group-block .items li{color:var(--ink);font-size:clamp(14px,1.28vw,18px)}
.group-block .items li::before{background:rgba(27,24,48,.42)!important}

/* ── Цитата ── */
.quote-block{
  position:relative;background:var(--purple);
  border-radius:var(--r-md) var(--r-md) var(--r-md) var(--r-nub);
  padding:22px 24px 22px 26px;margin:6px 0 12px;
}
.quote-block::before{
  content:'“';position:absolute;top:-2px;left:14px;
  font-size:62px;line-height:1;color:rgba(255,255,255,.5);font-weight:800;font-family:Georgia,serif;
}
.quote-block p{
  font-size:clamp(15.5px,1.55vw,21px);line-height:1.44;color:var(--ink);
  font-weight:500;position:relative;z-index:1;margin-bottom:0;
}
.quote-block .by{margin-top:10px;font-size:12.5px;font-weight:700;color:rgba(27,24,48,.6)}

/* ── Результат ── */
.result-block{
  background:var(--ink);color:#fff;
  border-radius:var(--r-md) var(--r-md) var(--r-md) var(--r-nub);
  padding:20px 24px;margin:8px 0 0;
}
.result-block p{
  font-size:clamp(16px,1.65vw,23px);line-height:1.36;color:rgba(255,255,255,.95);
  font-weight:600;margin-bottom:0;
}
.result-block strong{color:var(--orange);font-weight:800}
.result-block .by{margin-top:8px;font-size:12px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:rgba(255,255,255,.5)}
.cta-slide .result-block{background:rgba(255,255,255,.16)}

/* ── Жирная строка ── */
.boldline{
  background:var(--orange);border-radius:var(--r-md) var(--r-md) var(--r-nub) var(--r-md);
  padding:16px 20px;margin-top:10px;
}
.boldline strong{font-size:clamp(15px,1.5vw,21px);line-height:1.34;color:var(--ink);font-weight:800}

/* ── Опрос / чипы ── */
.tag-row{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0 12px;justify-content:inherit}
.cta-slide .tag-row,.center-slide .tag-row{justify-content:center}
.tag{
  background:var(--blue);border-radius:99px;padding:9px 20px;
  font-size:clamp(14px,1.3vw,18px);font-weight:700;color:var(--ink);
}
.tag:nth-child(3n+2){background:var(--purple)}
.tag:nth-child(3n+3){background:var(--orange)}

/* ── CTA-кнопка ── */
.cta-pill{
  display:inline-flex;align-items:center;gap:11px;align-self:flex-start;
  background:var(--ink);color:#fff;font-weight:800;
  padding:15px 30px;border-radius:99px;margin-top:18px;
  font-size:clamp(13.5px,1.32vw,18px);letter-spacing:.1px;
  box-shadow:0 12px 30px rgba(20,16,45,.26);
  animation:ctaPulse 2.6s ease-in-out infinite;
}
.cta-slide .cta-pill{background:#fff;color:var(--purple-deep);align-self:center}
.center-slide .cta-pill{align-self:center}
.cta-pill .arrow{color:var(--orange);font-weight:900;animation:ctaArrow 1.4s ease-in-out infinite;display:inline-block}
.cta-slide .cta-pill .arrow{color:var(--orange-deep)}
@keyframes ctaPulse{
  0%,100%{box-shadow:0 12px 30px rgba(20,16,45,.26)}
  50%{box-shadow:0 16px 40px rgba(20,16,45,.34),0 0 0 8px rgba(169,149,238,.18)}
}
@keyframes ctaArrow{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

/* ── Карточка тарифа ── */
.price-card{
  background:var(--paper2);border-radius:var(--r-md);padding:22px 26px;
  display:flex;flex-direction:column;gap:12px;
}
.slide.surf-b .price-card,.slide.surf-c .price-card{background:#fff}
.tier-name{font-size:clamp(17px,1.85vw,25px);font-weight:800;color:var(--ink);letter-spacing:-.3px}
.price-card .items{margin:0}
.price-card .items li{font-size:clamp(13px,1.15vw,16.5px)}
.price-bottom{
  margin-top:auto;padding-top:14px;border-top:1.5px solid var(--line);
  display:flex;flex-direction:column;gap:6px;
}
.price-strike{font-size:clamp(13px,1.15vw,16.5px);color:var(--ink3);font-weight:600}
.price-strike s{opacity:.8}
.price-hero{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--orange);border-radius:var(--r-md) var(--r-md) var(--r-nub) var(--r-md);
  padding:14px 20px;margin-top:6px;
}
.price-hero-label{font-size:clamp(12.5px,1.1vw,16px);font-weight:800;color:var(--ink);
  letter-spacing:1px;text-transform:uppercase;opacity:.72}
.price-hero-val{font-size:clamp(28px,3.4vw,48px);font-weight:900;color:var(--ink);line-height:1;letter-spacing:-1.5px}

/* ── Карточка / статы ── */
.card-generic{
  background:var(--purple);border-radius:var(--r-md) var(--r-md) var(--r-md) var(--r-nub);
  padding:20px 24px;margin:8px 0;
}
.card-generic .label{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  color:rgba(27,24,48,.55);margin-bottom:8px}
.card-generic p{color:var(--ink)}

/* ── Фото ── */
.photo-row{display:flex;gap:12px;justify-content:center;align-items:center;margin:10px 0}
.slide-photo{width:100%;max-height:46vh;object-fit:cover;border-radius:var(--r-md);flex:1;min-width:0}
.slide-photo.photo-contain{object-fit:contain}
.illus-wrap{display:flex;justify-content:center;margin:10px 0}
.illus-img{max-width:100%;max-height:44vh;object-fit:contain;border-radius:var(--r-md)}

.photocols{display:flex;gap:22px;align-items:flex-start}
.photocols.photo-right{flex-direction:row-reverse}
.photocols-img{width:34%;flex-shrink:0;border-radius:var(--r-md);object-fit:cover;max-height:56vh}
.photocols-img.img-contain{object-fit:contain}
.photocols-list{flex:1;min-width:0}

/* ── Отзыв ── */
.testimonial-card{
  background:var(--blue);border-radius:var(--r-md) var(--r-md) var(--r-md) var(--r-nub);
  padding:20px 24px;margin:8px 0;
}
.testimonial-card .star{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--orange-deep);margin-bottom:6px}
.testimonial-card .name{font-size:clamp(16px,1.7vw,22px);font-weight:800;color:var(--ink)}
.testimonial-card .meta{font-size:13px;color:rgba(27,24,48,.55);margin-bottom:10px}
.testimonial-card .quote-block{background:rgba(255,255,255,.55)}

/* ── Прочие блоки (совместимость) ── */
.segment-card,.research-card{display:flex;gap:18px;background:var(--paper2);border-radius:var(--r-md);padding:20px 24px;margin:8px 0}
.big-num{font-size:56px;font-weight:900;color:var(--purple-mid);line-height:1;flex-shrink:0}
.segment-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.seg-chips{display:flex;flex-wrap:wrap;gap:6px}
.seg-chip{border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;background:var(--blue);color:var(--ink)}
.seg-chip.psyche{background:var(--purple)}
.sci-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.sci-card{text-align:center;width:120px}
.sci-avatar{width:76px;height:76px;border-radius:50%;overflow:hidden;margin:0 auto 8px;background:var(--purple)}
.sci-avatar img{width:100%;height:100%;object-fit:cover}
.sci-init{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--purple-deep)}
.sci-name{font-size:13px;font-weight:700}
.sci-years{font-size:11px;color:var(--ink3)}
.qcard-row{display:flex;flex-direction:column;gap:10px}
.qcard{display:flex;gap:14px;background:var(--paper2);border-radius:var(--r-md);padding:14px 18px;align-items:center}
.qcard-left{display:flex;gap:8px;align-items:center;flex-shrink:0}
.qcard-num{width:26px;height:26px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.qcard-icon{font-size:20px}

/* ════ НАВИГАЦИЯ ════ */
.nav{display:flex;align-items:center;gap:8px;background:#fff;border-radius:99px;padding:7px 9px;
  box-shadow:0 10px 30px rgba(15,12,35,.32);flex-shrink:0}
.nav-btn{background:transparent;border:none;color:var(--ink);border-radius:50%;width:34px;height:34px;
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.15s}
.nav-btn:hover{background:var(--paper2)}
.nav-btn:disabled{opacity:.25;cursor:not-allowed}
.menu-toggle{background:transparent;border:none;color:var(--ink2);border-radius:50%;width:34px;height:34px;
  cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.menu-toggle:hover{background:var(--paper2)}

.menu-backdrop{position:fixed;inset:0;background:rgba(15,12,35,.5);opacity:0;pointer-events:none;
  transition:opacity .2s ease;z-index:30}
.menu-backdrop.open{opacity:1;pointer-events:all}
.menu-panel{
  position:absolute;bottom:78px;left:50%;transform:translate(-50%,12px) scale(.97);
  width:min(360px,90vw);max-height:min(72vh,600px);
  background:#fff;border-radius:22px;box-shadow:0 26px 70px rgba(15,12,35,.4);
  display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:.2s cubic-bezier(.4,0,.2,1);
}
.menu-backdrop.open .menu-panel{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:all}
.menu-panel-head{padding:16px 18px 8px;font-size:11px;font-weight:800;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--ink3);flex-shrink:0}
.menu-panel-list{overflow-y:auto;padding:2px 10px 14px}
.menu-sec{font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--orange-deep);padding:12px 8px 5px}
.menu-item{display:flex;gap:11px;align-items:center;padding:7px 9px;border-radius:11px;cursor:pointer}
.menu-item:hover{background:var(--paper2)}
.menu-item.active{background:var(--purple)}
.menu-num{min-width:22px;height:22px;border-radius:7px;background:var(--ink);color:#fff;
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-label{font-size:12.5px;color:var(--ink2)}
.menu-item.active .menu-label{color:var(--ink);font-weight:700}

@media (max-width:820px){
  .left-panel{padding:14px;gap:14px}
  .stage{width:min(92vw,78vh);height:min(92vw,78vh)}
  .slide{padding:22px 22px 30px;border-radius:22px}
  .progress-bar{left:22px;right:22px;bottom:16px}
  .hd{margin-bottom:14px}
  .brand{display:none}
  .hd-chip{max-width:62%}
  h1{font-size:clamp(21px,5.6vw,32px);letter-spacing:-.6px}
  .groups-row,.segment-two{grid-template-columns:1fr}
  .photocols{flex-direction:column}
  .photocols-img{width:100%;max-height:30vh}
}
</style>
</head>
<body>
<div class="left-panel">
  <div class="stage" id="stage"></div>
  <nav class="nav">
    <button class="nav-btn" id="prev" onclick="prevSlide()">←</button>
    <button class="menu-toggle" id="menuToggle">☰</button>
    <button class="nav-btn" id="next" onclick="nextSlide()">→</button>
  </nav>
</div>

<div class="menu-backdrop" id="menuBackdrop">
  <div class="menu-panel" id="menuPanel">
    <div class="menu-panel-head">Навигация · <span id="menuCounter">1 / 135</span></div>
    <div class="menu-panel-list" id="menuList"></div>

</div>
